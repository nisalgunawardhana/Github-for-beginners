<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card-header {
            background-color: #4a90e2;
            padding: 30px 0 10px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
        }

        .card-body {
            padding: 20px 25px 30px;
        }

        .student-name {
            font-size: 1.4rem;
            color: #333333;
            margin-bottom: 5px;
        }

        .student-major {
            font-size: 0.95rem;
            color: #4a90e2;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 0.9rem;
        }

        .info-group:last-child {
            border-bottom: none;
        }

        .label {
            color: #777777;
            font-weight: 500;
        }

        .value {
            color: #333333;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <img class="avatar" src="https://via.placeholder.com/100" alt="Student Photo">
        </div>
        <div class="card-body">
            <h2 class="student-name">Alex Johnson</h2>
            <p class="student-major">Computer Science</p>
            
            <div class="info-group">
                <span class="label">Student ID</span>
                <span class="value">CS-2026-89</span>
            </div>
            <div class="info-group">
                <span class="label">Academic Year</span>
                <span class="value">Junior (3rd Year)</span>
            </div>
            <div class="info-group">
                <span class="label">GPA</span>
                <span class="value">3.85</span>
            </div>
            <div class="info-group">
                <span class="label">Email</span>
                <span class="value">alex.j@univ.edu</span>
            </div>
        </div>
    </div>

</body>
</html>
